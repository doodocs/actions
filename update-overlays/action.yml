inputs:
  CHECKOUT_REPOSITORY:
    required: true
  CHECKOUT_TOKEN:
    required: true
  OVERLAYS:
    description: |
      Paths to the overlays as a JSON array string
      (e.g. ["overlays/dev","overlays/staging","overlays/prod"])'
    required: true
  KUSTOMIZE_IMAGE:
    required: true
  DOCKER_IMAGE:
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5
      with:
        repository: ${{ inputs.CHECKOUT_REPOSITORY }}
        token: ${{ inputs.CHECKOUT_TOKEN }}
        clean: true
        fetch-depth: 1

    - name: Install Kustomize and jq
      shell: bash
      env:
        KUSTOMIZE_VERSION: "5.3.0"
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Authenticated download via API first: anonymous release downloads get 504 during GitHub incidents.
        # curl -f makes an HTTP error fail the step instead of passing an HTML page on.
        ARCHIVE="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
        if ! { command -v gh >/dev/null 2>&1 && gh release download "kustomize/v${KUSTOMIZE_VERSION}" -R kubernetes-sigs/kustomize -p "${ARCHIVE}" -O "/tmp/${ARCHIVE}" --clobber; }; then
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
        fi
        tar xzf "/tmp/${ARCHIVE}" -C /tmp kustomize
        chmod +x /tmp/kustomize
        sudo mv /tmp/kustomize /usr/local/bin/kustomize
        kustomize version
        
        # Install jq (if not already installed)
        if ! command -v jq &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y jq
        fi

    - name: Update all overlays
      shell: bash
      run: |
        echo '${{ inputs.OVERLAYS }}' | jq -r '.[]' | while read -r overlay; do
          echo "Updating overlay: ${overlay}"
          cd "${overlay}"
          kustomize edit set image ${{ inputs.KUSTOMIZE_IMAGE }}=${{ inputs.DOCKER_IMAGE }}
          cd - > /dev/null
        done

    - name: Commit files
      shell: bash
      id: commit
      run: |
        # exit immediately if any command fails (non-zero exit code)
        set -e

        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # stage all changes in the working directory
        git add -A

        # If nothing changed, say so and exit successfully
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes"
          echo "committed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git commit -m "chore: update ${{ inputs.KUSTOMIZE_IMAGE }} image to ${{ inputs.DOCKER_IMAGE }} in all overlays"
        echo "committed=true" >> "$GITHUB_OUTPUT"

    - name: Push changes
      if: steps.commit.outputs.committed == 'true'
      shell: bash
      run: git push origin HEAD
